<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <article>
      <div class = "product-image">
        <picture>
            <source
                media="(max-width: 600px)"
                srcset="./images/image-product-mobile.jpg"
            >
            <img
                src="./images/image-product-desktop.jpg"
                alt="Chanel Gabrielle Essence perfume bottle"
            >
        </picture>
      </div>
      <div class = "product-info">
        <p>PERFUME</p>
        <h1>
          Gabrielle Essence Eau De Parfum
        </h1>
        <p>A floral, solar and voluptuous interpretation 
          composed by Olivier Polge, 
          perfumer-creator for the House of CHANEL
        </p>
        <div class = "product-price">
          <span>$149.99</span>
          <p>$169.99</p>
        </div>
        <button>
          <img src="./images/icon-cart.svg" alt="">
          Add to Cart
        </button>
      </div>
    </article>
  </main>
</body>
</html>
